services:
  app:
    # Pool PHP-FPM (multi-workers) : nginx lui délègue le PHP (ADR-0018)
    build: docker/php
    volumes:
      - .:/var/www/html
    extra_hosts:
      # Generation targets the host's native Ollama (Metal GPU, ADR-0022)
      # via host.docker.internal — explicit for Docker Desktop portability
      # (OrbStack provides it out of the box).
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy

  nginx:
    # Vrai serveur HTTP : statiques + multiplexage vers PHP-FPM —
    # un SSE ouvert ne bloque plus les autres requêtes (ADR-0018)
    image: nginx:1.28-alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/up"]
      interval: 5s
      timeout: 3s
      retries: 10

  node:
    # Frontend tooling (Vite dev server with HMR) — no node on the host
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html

  ollama:
    # Local inference server: serves the embedding model over a simple REST API
    image: ollama/ollama:0.30.7
    environment:
      # Each query uses two models (embeddings + chat): pin both in
      # memory, otherwise reloads cause 30-100s latency outliers
      # (ADR-0016). Needs ~4.5GB RAM in the Docker VM.
      OLLAMA_KEEP_ALIVE: -1
      OLLAMA_MAX_LOADED_MODELS: 2
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      # The ollama binary is also a client: "ollama list" probes the server
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

  db:
    # Image PostgreSQL 17 avec l'extension pgvector préinstallée
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
  ollama:
