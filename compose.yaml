services:
  app:
    build: docker/php
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      # artisan serve is single-worker by default: while an SSE answer
      # streams (~10s), no other request would be served (ADR-0017).
      PHP_CLI_SERVER_WORKERS: 4
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy

  node:
    # Frontend tooling (Vite dev server with HMR) — no node on the host
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html

  ollama:
    # Local inference server: serves the embedding model over a simple REST API
    image: ollama/ollama:0.30.7
    environment:
      # Each query uses two models (embeddings + chat): pin both in
      # memory, otherwise reloads cause 30-100s latency outliers
      # (ADR-0016). Needs ~4.5GB RAM in the Docker VM.
      OLLAMA_KEEP_ALIVE: -1
      OLLAMA_MAX_LOADED_MODELS: 2
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      # The ollama binary is also a client: "ollama list" probes the server
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

  db:
    # Image PostgreSQL 17 avec l'extension pgvector préinstallée
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
  ollama:
