server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Static assets (public/build…) are served directly by nginx;
    # everything else goes through Laravel's front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

        # SSE answers (ADR-0017) stay open for the whole generation.
        # Buffering is disabled per-response by the X-Accel-Buffering: no
        # header the streaming endpoint already sends.
        fastcgi_read_timeout 600s;
    }
}
